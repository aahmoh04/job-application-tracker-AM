# Dependabot opens a pull request when a dependency has a newer version, and
# every one of those runs the same CI as any other change. Without this,
# security fixes only surface when someone happens to run npm audit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates arrive together in one pull request a week,
    # majors one by one, since those are the ones that can break things.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The Node types follow the Node version the app runs on, 22 in CI and
    # locally. A newer major would describe functions Node 22 does not have,
    # and the typecheck would let them through until they fail at runtime.
    # They move with the runtime, by hand, never on their own.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
