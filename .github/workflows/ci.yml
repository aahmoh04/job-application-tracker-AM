name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions. The workflow only reads the code, it never writes back.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
# Without this you pay for builds whose result nobody will ever look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    # No database is reached here. `prisma generate` only reads the schema and
    # writes TypeScript, but prisma.config.ts resolves DATABASE_URL while
    # loading, so the variable has to exist. Deliberately not a real one.
    env:
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
