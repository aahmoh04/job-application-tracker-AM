name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions. The workflow only reads the code, it never writes back.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
# Without this you pay for builds whose result nobody will ever look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    # A real Postgres and a real Redis for the integration tests, the same
    # major versions as docker-compose.yml. GitHub starts both next to the job
    # and waits for their health checks before the first step runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jobtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d jobtracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # DATABASE_URL only has to exist. `prisma generate` and the build read it
    # without connecting, so it deliberately points at nothing. The integration
    # tests get their own variable, and their setup refuses any database whose
    # name does not end in _test.
    env:
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      TEST_DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/jobtracker_test?schema=public"
      TEST_REDIS_URL: "redis://127.0.0.1:6379/15"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
